# The Python package (document 08). pip and the wheel builds use scikit-build-core,
# which runs the CMake build with the options below. The CUDA packages
# (just-ba-cu12, just-ba-cu13) are built from this file after
# packaging/variant.py has rewritten their name, dependencies and CMake options.

[build-system]
requires = ["scikit-build-core>=0.11", "nanobind==3.1.0", "numpy>=1.26"]  # numpy: the stub generation imports just_ba
build-backend = "scikit_build_core.build"

[project]
name = "just-ba"
dynamic = ["version"]
description = "Minimal, fast bundle adjustment: CPU, Metal and CUDA backends, pose priors from ARKit and ARCore"
readme = "bindings/python/README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = ["numpy>=1.26"]
keywords = ["bundle adjustment", "structure from motion", "photogrammetry", "ARKit", "ARCore"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: C++",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Image Processing",
]

[project.optional-dependencies]
test = ["pytest"]

[tool.scikit-build]
minimum-version = "build-system.requires"
cmake.version = ">=3.24"
build-dir = "build/wheel/{wheel_tag}"
# One wheel per platform for every Python from 3.12 (stable ABI, D74).
wheel.py-api = "cp312"
wheel.packages = ["bindings/python/just_ba"]
sdist.exclude = ["CLAUDE.md", "bench", "docs", "docs-site", "tests/data", "build", "wheelhouse", "dist", ".github", ".claude"]

[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.regex"
input = "CMakeLists.txt"
regex = 'project\(just_ba VERSION (?P<value>[0-9.]+)'

[tool.scikit-build.cmake.define]
JBA_BUILD_PYTHON = "ON"
JBA_BUILD_TESTS = "OFF"
JBA_BUILD_CLI = "OFF"
JBA_PACKAGE_VARIANT = "cpu"

# Wheels (document 08, D114): built by .github/workflows/release.yml, started by hand
# (D111). One abi3 wheel per platform, tested with the Python tests. The CUDA
# packages add their settings in the workflow (CIBW_* variables).
[tool.cibuildwheel]
build = "cp312-*"
skip = ["*-musllinux_*", "*-win32", "*_i686"]
build-verbosity = 1
test-requires = ["pytest"]
test-command = "pytest -q {project}/bindings/python/tests"

[tool.cibuildwheel.linux]
archs = ["x86_64"]  # no Linux arm64 in the first release (D108)

[tool.cibuildwheel.macos]
archs = ["arm64"]
# Metal 3.0, the language version the Metal backend compiles its kernels with.
environment = { MACOSX_DEPLOYMENT_TARGET = "13.0" }

[tool.cibuildwheel.windows]
archs = ["AMD64"]
