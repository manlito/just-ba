# The documentation site (document 08, D119), with the live demo (D148). Runs on
# every push to main, which builds the site and deploys it, and by hand:
#
#   gh workflow run docs                    # build, run the docstring examples
#   gh workflow run docs -f deploy=true     # the same, then publish to Cloudflare Pages
#   gh workflow run docs -f demo=false      # without the live demo
#   gh workflow run docs -f poselib_ref=<branch, tag or commit>
#
# The live demo is the demo app built as WebAssembly. It needs poselib-gpu's sources,
# a public repository checked out next to this one (main unless poselib_ref says
# otherwise), Emscripten and emdawnwebgpu as in ci.yml's WebAssembly job, and the
# keypoints and matcher modules, fetched from just-keypoints' and just-matching's sites
# with pinned hashes (demo/tools/fetch_match_web.sh, D156). The live capture's keep rules
# (demo/web/gates.js, D157) are tested with Node first.
#
# Free hosted runner (D39). Deploying needs the repository secrets
# CLOUDFLARE_API_TOKEN (permission "Cloudflare Pages: Edit") and
# CLOUDFLARE_ACCOUNT_ID, and a Pages project made for direct upload, named by the
# repository variable CLOUDFLARE_PAGES_PROJECT (default "just-ba").
name: docs

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**"]
  workflow_dispatch:
    inputs:
      deploy:
        description: "Publish to Cloudflare Pages"
        type: boolean
        default: false
      demo:
        description: "Build and include the live demo"
        type: boolean
        default: true
      poselib_ref:
        description: "poselib-gpu branch, tag or commit for the demo"
        type: string
        default: main

concurrency:
  group: docs
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  docs:
    name: build (and deploy) the site
    runs-on: ubuntu-24.04
    env:
      # A push takes the defaults: the demo from poselib-gpu's main, and a deploy.
      DEMO: ${{ github.event_name == 'push' || inputs.demo }}
      DEPLOY: ${{ github.event_name == 'push' || inputs.deploy }}
      EMSDK_VERSION: "7.0.0"
      DAWN_RELEASE: v20261113.214538
    steps:
      - uses: actions/checkout@v4
      - name: Test the live capture's keep rules
        run: node --test demo/web/gates.test.mjs
      - uses: actions/checkout@v4
        if: env.DEMO == 'true'
        with:
          repository: manlito/poselib-gpu
          ref: ${{ inputs.poselib_ref || 'main' }}
          path: poselib-gpu
      - name: Cache Emscripten
        if: env.DEMO == 'true'
        uses: actions/cache@v4
        with:
          path: ~/emsdk
          key: emsdk-${{ env.EMSDK_VERSION }}
      - name: Install Emscripten, Ninja and emdawnwebgpu
        if: env.DEMO == 'true'
        run: |
          [ -d ~/emsdk ] || git clone --depth 1 https://github.com/emscripten-core/emsdk.git ~/emsdk
          ~/emsdk/emsdk install ${EMSDK_VERSION}
          ~/emsdk/emsdk activate ${EMSDK_VERSION}
          sudo apt-get install -y -q ninja-build
          mkdir -p third_party/webgpu/emdawnwebgpu
          curl -sSfL -o emdawnwebgpu.zip \
            "https://github.com/google/dawn/releases/download/${DAWN_RELEASE}/emdawnwebgpu_pkg-${DAWN_RELEASE}.zip"
          unzip -q emdawnwebgpu.zip -d third_party/webgpu/emdawnwebgpu
      - name: Fetch the demo's keypoints and matcher (just-keypoints, just-matching; pinned hashes)
        if: env.DEMO == 'true'
        run: demo/tools/fetch_match_web.sh
      - name: Build the live demo
        if: env.DEMO == 'true'
        run: |
          echo "just-ba $(git rev-parse HEAD), poselib-gpu $(git -C poselib-gpu rev-parse HEAD)"
          source ~/emsdk/emsdk_env.sh
          emcmake cmake -S . -B build-demo -G Ninja -DCMAKE_BUILD_TYPE=Release -DJBA_BUILD_DEMO=ON \
            -DJBA_WITH_WEBGPU=ON -DJBA_POSELIB_GPU_DIR="$GITHUB_WORKSPACE/poselib-gpu"
          cmake --build build-demo --target jba_demo_wasm
          ls -l build-demo/demo/web
          echo "JBA_DEMO_WEB=build-demo/demo/web" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        id: py
        with:
          python-version: "3.12"
      - name: Install requirements
        run: python -m pip install -r bindings/python/requirements.txt -r docs-site/requirements.txt
      # The API reference and the docstring examples import the module: the CPU build.
      - name: Build the Python module
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DJBA_BUILD_PYTHON=ON -DJBA_BUILD_TESTS=OFF \
            -DJBA_BUILD_CLI=OFF -DPython_EXECUTABLE="${{ steps.py.outputs.python-path }}"
          cmake --build build --parallel --target _core_stub
      - name: Build the site (warnings are errors)
        env:
          PYTHONPATH: build/bindings/python
        run: sphinx-build -W --keep-going -b html docs-site docs-site/_build/html
      - name: Run the docstring examples
        env:
          PYTHONPATH: build/bindings/python
        run: sphinx-build -W --keep-going -b doctest docs-site docs-site/_build/doctest
      - uses: actions/upload-artifact@v7
        with:
          name: docs-html
          path: docs-site/_build/html
      - name: Deploy to Cloudflare Pages
        if: env.DEPLOY == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >
          npx --yes wrangler@4.162.0 pages deploy docs-site/_build/html
          --project-name "${{ vars.CLOUDFLARE_PAGES_PROJECT || 'just-ba' }}" --branch main
