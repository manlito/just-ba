# Free hosted runners only (decision D39). No schedules, no GPU runners.
#
# Runs on every push to main, a merge included, in quick mode, and by hand (D148,
# replacing D49's manual trigger). Not on pull requests: hosted minutes count against
# the plan's quota, macOS at 10x and Windows at 2x. Pushes that change only the
# planning notes in docs/ are skipped.
#
# Two modes (decision D61):
#   quick (default): Linux and Windows build and test, Ceres parity without the
#                    slow tests, the benchmark gate (D117), the CUDA and WebGPU
#                    backends compiled and the WebAssembly module built (D104,
#                    D128). macOS is tested on the owner's Mac instead.
#   full:            adds macOS and the slow tests (venice-52 parity).
# GPU tests, Metal included, are never run here (D40, D110): bench/gpu_check.py.
#
#   gh workflow run ci                      # quick
#   gh workflow run ci -f full=true         # full
name: ci

on:
  workflow_dispatch:
    inputs:
      full:
        description: "Full run: add macOS (10x minutes) and slow tests"
        type: boolean
        default: false
  push:
    branches: [main]
    paths-ignore: ["docs/**"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.full && '["ubuntu-24.04", "windows-2025", "macos-15"]' || '["ubuntu-24.04", "windows-2025"]') }}
    steps:
      - uses: actions/checkout@v4
      # Python bindings (nanobind is a build-time dependency only).
      - uses: actions/setup-python@v5
        id: py
        with:
          python-version: "3.12"
      - name: Install binding build and test requirements
        run: python -m pip install -r bindings/python/requirements.txt
      - name: Configure
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DJBA_BUILD_PYTHON=ON
          -DPython_EXECUTABLE="${{ steps.py.outputs.python-path }}"
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure -LE "gpu|slow"
      # GPU tests are run by hand (D40), Metal included (D110): bench/gpu_check.py.

  # The live demo's whole pipeline from Python (D162): just-keypoints, just-matching and
  # poselib-gpu from PyPI, just-ba built here, LightGlue's weights from their release
  # (cached), on the CPU. The first 16 sample images in quick mode (120 pairs, about a
  # minute of matching on an M5 Pro's CPU), 24 in full mode (276 pairs). All 44 (946
  # pairs, 7 minutes on the M5 Pro, 40 on an i7-9750H) would take a hosted runner's
  # 4 CPUs an hour or more. Not on Windows; Metal and CUDA are run by hand.
  pipeline:
    name: Python pipeline (CPU)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        id: py
        with:
          python-version: "3.12"
      - name: Install requirements
        run: python -m pip install -r bindings/python/requirements.txt pillow just-keypoints just-matching poselib-gpu
      - name: Cache LightGlue's weights
        uses: actions/cache@v4
        with:
          path: tests/data/weights
          key: weights-${{ hashFiles('tests/pipeline/fetch_weights.py') }}
      - name: Fetch LightGlue's weights
        run: python tests/pipeline/fetch_weights.py
      - name: Configure
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DJBA_BUILD_PYTHON=ON
          -DPython_EXECUTABLE="${{ steps.py.outputs.python-path }}"
      - name: Build
        run: cmake --build build --parallel --target _core
      - name: Test
        env:
          JBA_PIPELINE_IMAGES: ${{ inputs.full && '24' || '16' }}
          JBA_PIPELINE_REQUIRE: cpu
        run: ctest --test-dir build --output-on-failure -V -R '^python_pipeline$' --no-tests=error

  ceres:
    name: Ceres reference (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
    steps:
      - uses: actions/checkout@v4
      # The Ceres build takes about 8 minutes; the cache makes it seconds until
      # third_party/ceres/build.cmake changes.
      - name: Cache Ceres build
        uses: actions/cache@v4
        with:
          path: ceres-prefix
          key: ceres-2.2.0-${{ runner.os }}-${{ hashFiles('third_party/ceres/build.cmake') }}
      - name: Cache BAL data
        uses: actions/cache@v4
        with:
          path: tests/data/bal
          key: bal-${{ hashFiles('tests/data/fetch_bal.py') }}
      - name: Build Ceres 2.2.0 (minimal)
        run: cmake -DPREFIX=${{ github.workspace }}/ceres-prefix -P third_party/ceres/build.cmake
      - name: Fetch BAL problems
        run: python3 tests/data/fetch_bal.py
      - name: Configure
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DJBA_WITH_CERES=ON
          -DCMAKE_PREFIX_PATH=${{ github.workspace }}/ceres-prefix
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure -j 4 -LE "${{ inputs.full && 'gpu' || 'gpu|slow' }}"

  # The regression gate of document 05 on the CPU (D117): run.py on the BAL problems
  # (venice-52 left out, as in quick mode) and the synthetic ones, compared with this
  # runner's baseline. Hosted runners differ in CPU from run to run, so the gate is
  # loose: final costs to 1e-6 relative (Level 2's tolerance), counts within 10%,
  # and time per iteration up to 50% slower, checked only when the runner has the
  # baseline's CPU model (the same label ran 1.5 to 2x slower on another run of the
  # same code). The result is kept as an artifact.
  bench:
    name: benchmark gate (CPU)
    runs-on: ubuntu-24.04
    env:
      BASELINE: bench/baseline/github-ubuntu-24.04.json
    steps:
      - uses: actions/checkout@v4
      - name: Cache BAL data
        uses: actions/cache@v4
        with:
          path: tests/data/bal
          key: bal-${{ hashFiles('tests/data/fetch_bal.py') }}
      - name: Fetch BAL problems
        run: python3 tests/data/fetch_bal.py
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --parallel --target just-ba jba_make_problem
      - name: Benchmark and compare
        run: |
          args="--build build --threads 4 --skip problem-52 --out bench-result.json"
          if [ -f "$BASELINE" ]; then
            python3 bench/run.py $args --compare "$BASELINE" --cost-rtol 1e-6 --count-slack 0.1 --max-slowdown 0.5 --time-same-cpu
          else
            python3 bench/run.py $args
            echo "::warning::no $BASELINE yet: this run's bench-result.json (artifact) becomes it once committed"
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: bench-${{ github.sha }}
          path: bench-result.json
          retention-days: 90

  # Document 08's "CUDA kernels compiled (not run)": the CUDA backend and cuDSS's
  # solver built with nvcc on a hosted runner without a GPU (review of milestone 5,
  # finding 7). The toolkit's compiler and runtime from NVIDIA's apt repository,
  # cuDSS from its redistributable archive; the tests run, and the CUDA ones skip
  # (no device). Free: the hosted Linux runner, no GPU.
  cuda-compile:
    name: CUDA backend compiled (not run)
    runs-on: ubuntu-24.04
    env:
      # The laptop's CUDA; the CUDA sources are C++20, so CUDA 12 builds too (D113).
      CUDA_VERSION: "13-4"
      CUDA_DIR: /usr/local/cuda-13.4
      CUDSS_ARCHIVE: libcudss-linux-x86_64-1.0.0.35_cuda13-archive
    steps:
      - uses: actions/checkout@v4
      - name: Install the CUDA compiler and runtime
        run: |
          wget -q https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2404/x86_64/cuda-keyring_1.1-1_all.deb
          sudo dpkg -i cuda-keyring_1.1-1_all.deb
          sudo apt-get update -q
          sudo apt-get install -y -q cuda-nvcc-${CUDA_VERSION} cuda-cudart-dev-${CUDA_VERSION} libcublas-dev-${CUDA_VERSION} cuda-nvrtc-${CUDA_VERSION}
          echo "${CUDA_DIR}/bin" >> "$GITHUB_PATH"
          echo "LD_LIBRARY_PATH=${CUDA_DIR}/lib64" >> "$GITHUB_ENV"
      # The runner's CMake and GCC 13 do not give nvcc C++23 ("CUDA23", first CI run):
      # a current CMake, and GCC 14 as the host compiler.
      - name: Install CMake and GCC 14
        run: |
          python3 -m pip install --user "cmake>=4.0"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          sudo apt-get install -y -q g++-14
      - name: Fetch cuDSS
        run: |
          wget -q https://developer.download.nvidia.com/compute/cudss/redist/libcudss/linux-x86_64/${CUDSS_ARCHIVE}.tar.xz
          tar xf ${CUDSS_ARCHIVE}.tar.xz
      - name: Configure
        run: >
          cmake --version &&
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DJBA_WITH_CUDA=ON -DJBA_WITH_CUDSS=ON
          -DCMAKE_C_COMPILER=gcc-14 -DCMAKE_CXX_COMPILER=g++-14 -DCMAKE_CUDA_HOST_COMPILER=g++-14
          -DCMAKE_CUDA_COMPILER=${CUDA_DIR}/bin/nvcc -DCMAKE_CUDA_ARCHITECTURES=75 -Dcudss_DIR=${{ github.workspace }}/${{ env.CUDSS_ARCHIVE }}/lib/cmake/cudss
      - name: Build
        run: cmake --build build --parallel
      - name: Test (CUDA tests skip without a device)
        run: ctest --test-dir build --output-on-failure -j 4 -LE slow

  # The WebGPU backend (D127, D128), natively against Dawn's prebuilt Linux release
  # (D122), on a hosted runner without a GPU: built, and the tests run with the GPU
  # ones skipping (no adapter), like the CUDA job. GPU runs are by hand (D40).
  webgpu-native:
    name: WebGPU backend compiled (not run)
    runs-on: ubuntu-24.04
    env:
      DAWN_RELEASE: v20261113.214538
      DAWN_ASSET: Dawn-7daf3b0bee2c73621001ab15b256b5a84fb0b45f-ubuntu-latest-Release.tar.gz
    steps:
      - uses: actions/checkout@v4
      - name: Cache Dawn
        uses: actions/cache@v4
        with:
          path: third_party/webgpu/dawn
          key: ${{ env.DAWN_ASSET }}
      - name: Fetch Dawn
        run: |
          if ! ls -d third_party/webgpu/dawn/Dawn-* > /dev/null 2>&1; then
            mkdir -p third_party/webgpu/dawn
            curl -sSfL "https://github.com/google/dawn/releases/download/${DAWN_RELEASE}/${DAWN_ASSET}" \
              | tar xz -C third_party/webgpu/dawn
          fi
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DJBA_WITH_WEBGPU=ON
      - name: Build
        run: cmake --build build --parallel
      - name: Test (WebGPU tests skip without an adapter)
        run: ctest --test-dir build --output-on-failure -j 4 -LE slow
      # The kernels never run here, so Tint compiling them is the check on the WGSL
      # (D132). An error if the test is missing, which it is when Tint is not found.
      - name: WGSL compiles (Tint)
        run: ctest --test-dir build --output-on-failure -V -R '^webgpu_wgsl_compiles$' --no-tests=error

  # The WebAssembly module for the browser (D124, D127): Emscripten 7.0.0 and
  # emdawnwebgpu from the same Dawn release, built only (no browser here).
  webgpu-wasm:
    name: WebAssembly module built
    runs-on: ubuntu-24.04
    env:
      EMSDK_VERSION: "7.0.0"
      DAWN_RELEASE: v20261113.214538
    steps:
      - uses: actions/checkout@v4
      - name: Cache Emscripten
        uses: actions/cache@v4
        with:
          path: ~/emsdk
          key: emsdk-${{ env.EMSDK_VERSION }}
      - name: Install Emscripten and Ninja
        run: |
          [ -d ~/emsdk ] || git clone --depth 1 https://github.com/emscripten-core/emsdk.git ~/emsdk
          ~/emsdk/emsdk install ${EMSDK_VERSION}
          ~/emsdk/emsdk activate ${EMSDK_VERSION}
          sudo apt-get install -y -q ninja-build
      - name: Fetch emdawnwebgpu
        run: |
          mkdir -p third_party/webgpu/emdawnwebgpu
          curl -sSfL -o emdawnwebgpu.zip \
            "https://github.com/google/dawn/releases/download/${DAWN_RELEASE}/emdawnwebgpu_pkg-${DAWN_RELEASE}.zip"
          unzip -q emdawnwebgpu.zip -d third_party/webgpu/emdawnwebgpu
      - name: Configure and build
        run: |
          source ~/emsdk/emsdk_env.sh
          emcmake cmake -S . -B build/wasm -G Ninja -DJBA_WITH_WEBGPU=ON -DJBA_BUILD_WASM=ON
          cmake --build build/wasm
          ls -l build/wasm/bindings/wasm

  generated-code:
    name: generated code is current
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install generator
        run: python -m pip install -r residuals/symbolic/requirements.txt
      - name: Check
        run: python residuals/symbolic/generate.py --check
