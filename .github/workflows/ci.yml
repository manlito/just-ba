# Free hosted runners only (decision D39). No schedules, no GPU runners.
#
# Manual trigger only while the repository is private (decision D49): on private
# repositories hosted minutes count against a quota, macOS at 10x and Windows at 2x.
# When the repository goes public (after milestone 2), uncomment push and
# pull_request.
#
# Two modes (decision D61):
#   quick (default): Linux and Windows build and test, Ceres parity without the
#                    slow tests, the benchmark gate (D117). macOS is tested on the
#                    owner's Mac instead.
#   full:            adds macOS and the slow tests (venice-52 parity).
# GPU tests, Metal included, are never run here (D40, D110): bench/gpu_check.py.
#
#   gh workflow run ci                      # quick
#   gh workflow run ci -f full=true         # full
name: ci

on:
  workflow_dispatch:
    inputs:
      full:
        description: "Full run: add macOS (10x minutes) and slow tests"
        type: boolean
        default: false
  # push:
  #   branches: [main]
  # pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.full && '["ubuntu-24.04", "windows-2025", "macos-15"]' || '["ubuntu-24.04", "windows-2025"]') }}
    steps:
      - uses: actions/checkout@v4
      # Python bindings (nanobind is a build-time dependency only).
      - uses: actions/setup-python@v5
        id: py
        with:
          python-version: "3.12"
      - name: Install binding build and test requirements
        run: python -m pip install -r bindings/python/requirements.txt
      - name: Configure
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DJBA_BUILD_PYTHON=ON
          -DPython_EXECUTABLE="${{ steps.py.outputs.python-path }}"
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure -LE "gpu|slow"
      # GPU tests are run by hand (D40), Metal included (D110): bench/gpu_check.py.

  ceres:
    name: Ceres reference (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
    steps:
      - uses: actions/checkout@v4
      # The Ceres build takes about 8 minutes; the cache makes it seconds until
      # third_party/ceres/build.cmake changes.
      - name: Cache Ceres build
        uses: actions/cache@v4
        with:
          path: ceres-prefix
          key: ceres-2.2.0-${{ runner.os }}-${{ hashFiles('third_party/ceres/build.cmake') }}
      - name: Cache BAL data
        uses: actions/cache@v4
        with:
          path: tests/data/bal
          key: bal-${{ hashFiles('tests/data/fetch_bal.py') }}
      - name: Build Ceres 2.2.0 (minimal)
        run: cmake -DPREFIX=${{ github.workspace }}/ceres-prefix -P third_party/ceres/build.cmake
      - name: Fetch BAL problems
        run: python3 tests/data/fetch_bal.py
      - name: Configure
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DJBA_WITH_CERES=ON
          -DCMAKE_PREFIX_PATH=${{ github.workspace }}/ceres-prefix
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure -j 4 -LE "${{ inputs.full && 'gpu' || 'gpu|slow' }}"

  # The regression gate of document 05 on the CPU (D117): run.py on the BAL problems
  # (venice-52 left out, as in quick mode) and the synthetic ones, compared with this
  # runner's baseline. Hosted runners differ in CPU from run to run, so the gate is
  # loose: final costs to 1e-6 relative (Level 2's tolerance), counts within 10%,
  # and time per iteration up to 50% slower, checked only when the runner has the
  # baseline's CPU model (the same label ran 1.5 to 2x slower on another run of the
  # same code). The result is kept as an artifact.
  bench:
    name: benchmark gate (CPU)
    runs-on: ubuntu-24.04
    env:
      BASELINE: bench/baseline/github-ubuntu-24.04.json
    steps:
      - uses: actions/checkout@v4
      - name: Cache BAL data
        uses: actions/cache@v4
        with:
          path: tests/data/bal
          key: bal-${{ hashFiles('tests/data/fetch_bal.py') }}
      - name: Fetch BAL problems
        run: python3 tests/data/fetch_bal.py
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --parallel --target just-ba jba_make_problem
      - name: Benchmark and compare
        run: |
          args="--build build --threads 4 --skip problem-52 --out bench-result.json"
          if [ -f "$BASELINE" ]; then
            python3 bench/run.py $args --compare "$BASELINE" --cost-rtol 1e-6 --count-slack 0.1 --max-slowdown 0.5 --time-same-cpu
          else
            python3 bench/run.py $args
            echo "::warning::no $BASELINE yet: this run's bench-result.json (artifact) becomes it once committed"
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: bench-${{ github.sha }}
          path: bench-result.json
          retention-days: 90

  # Document 08's "CUDA kernels compiled (not run)": the CUDA backend and cuDSS's
  # solver built with nvcc on a hosted runner without a GPU (review of milestone 5,
  # finding 7). The toolkit's compiler and runtime from NVIDIA's apt repository,
  # cuDSS from its redistributable archive; the tests run, and the CUDA ones skip
  # (no device). Free: the hosted Linux runner, no GPU.
  cuda-compile:
    name: CUDA backend compiled (not run)
    runs-on: ubuntu-24.04
    env:
      # The laptop's CUDA; the CUDA sources are C++20, so CUDA 12 builds too (D113).
      CUDA_VERSION: "13-4"
      CUDA_DIR: /usr/local/cuda-13.4
      CUDSS_ARCHIVE: libcudss-linux-x86_64-1.0.0.35_cuda13-archive
    steps:
      - uses: actions/checkout@v4
      - name: Install the CUDA compiler and runtime
        run: |
          wget -q https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2404/x86_64/cuda-keyring_1.1-1_all.deb
          sudo dpkg -i cuda-keyring_1.1-1_all.deb
          sudo apt-get update -q
          sudo apt-get install -y -q cuda-nvcc-${CUDA_VERSION} cuda-cudart-dev-${CUDA_VERSION} libcublas-dev-${CUDA_VERSION} cuda-nvrtc-${CUDA_VERSION}
          echo "${CUDA_DIR}/bin" >> "$GITHUB_PATH"
          echo "LD_LIBRARY_PATH=${CUDA_DIR}/lib64" >> "$GITHUB_ENV"
      # The runner's CMake and GCC 13 do not give nvcc C++23 ("CUDA23", first CI run):
      # a current CMake, and GCC 14 as the host compiler.
      - name: Install CMake and GCC 14
        run: |
          python3 -m pip install --user "cmake>=4.0"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          sudo apt-get install -y -q g++-14
      - name: Fetch cuDSS
        run: |
          wget -q https://developer.download.nvidia.com/compute/cudss/redist/libcudss/linux-x86_64/${CUDSS_ARCHIVE}.tar.xz
          tar xf ${CUDSS_ARCHIVE}.tar.xz
      - name: Configure
        run: >
          cmake --version &&
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DJBA_WITH_CUDA=ON -DJBA_WITH_CUDSS=ON
          -DCMAKE_C_COMPILER=gcc-14 -DCMAKE_CXX_COMPILER=g++-14 -DCMAKE_CUDA_HOST_COMPILER=g++-14
          -DCMAKE_CUDA_COMPILER=${CUDA_DIR}/bin/nvcc -DCMAKE_CUDA_ARCHITECTURES=75 -Dcudss_DIR=${{ github.workspace }}/${{ env.CUDSS_ARCHIVE }}/lib/cmake/cudss
      - name: Build
        run: cmake --build build --parallel
      - name: Test (CUDA tests skip without a device)
        run: ctest --test-dir build --output-on-failure -j 4 -LE slow

  generated-code:
    name: generated code is current
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install generator
        run: python -m pip install -r residuals/symbolic/requirements.txt
      - name: Check
        run: python residuals/symbolic/generate.py --check
